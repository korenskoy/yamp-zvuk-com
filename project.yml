name: YAMP
options:
  bundleIdPrefix: ru.korenskoy
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  groupSortPosition: top

packages:
  ZvukMusic:
    url: https://github.com/korenskoy/zvuk-swift.git
    from: "0.2.0"
  LastFM.swift:
    url: https://github.com/duhnnie/LastFM.swift
    from: "1.6.1"

targets:
  YAMP:
    type: application
    platform: macOS
    sources:
      - path: Sources/YAMP
    resources:
      - path: Sources/YAMP/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.korenskoy.zvuk-unofficial
        PRODUCT_NAME: YAMP
        MARKETING_VERSION: "1.1.1"
        CURRENT_PROJECT_VERSION: "72"
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: YAMP.entitlements
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: true
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        ENABLE_HARDENED_RUNTIME: true
    dependencies:
      - package: ZvukMusic
        product: ZvukMusic
      - package: LastFM.swift
        product: LastFM
    entitlements:
      path: YAMP.entitlements
